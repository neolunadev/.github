name: house

on:
  workflow_call:
    inputs:
      markdownlint:
        description: Lint every Markdown file. Off for repos with legacy docs.
        type: boolean
        default: true
      lychee-args:
        description: Extra lychee arguments, such as --exclude-path entries.
        type: string
        default: ""
      allow-data:
        description: Skip the data-file check. Only for repos with a pending data migration.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary directly: MIT-licensed, no licence key for orgs.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: inputs.markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          failIfEmpty: false
          args: --offline --no-progress ${{ inputs.lychee-args }} '**/*.md'
      # House style: no em dashes in new writing. Checks only lines this PR adds.
      - name: No em dashes in added lines
        if: github.event_name == 'pull_request'
        run: |
          if git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- '*.md' | grep '^+[^+]' | grep -n $'\u2014'; then
            echo "::error::Em dash in added Markdown. Recast with a comma, colon or full stop."
            exit 1
          fi

  # Data lives in Supabase or Google Drive, never in git. Checks only files this PR adds.
  data:
    name: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No data files added
        if: github.event_name == 'pull_request' && !inputs.allow-data
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in */fixtures/*|fixtures/*) continue ;; esac
            case "${f,,}" in
              *.zip|*.rar|*.7z|*.xlsx|*.xls) echo "::error file=$f::Archive or spreadsheet. Large files go in Google Drive, tabular data in Supabase."; bad=1 ;;
              *.csv|*.json|*.parquet)
                if [ "$(stat -c %s "$f")" -gt 1048576 ]; then echo "::error file=$f::Data file over 1 MB. Tabular data goes in Supabase; small test data goes in a fixtures folder."; bad=1; fi ;;
            esac
          done < <(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")
          exit $bad

  # Conventional Commits in the PR title, which becomes the squash commit.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
