name: house

# Runs on Luke's PC by default (the org's self-hosted runners), because GitHub-hosted minutes
# cost money for private repos. Public repos (this one, ruby) pass `runner: '"ubuntu-latest"'`:
# hosted minutes are free for them, and the org's runners refuse public repos. Every step works
# on Windows (Git Bash) and Linux, so no step needs Docker.

on:
  workflow_call:
    inputs:
      markdownlint:
        description: Lint every Markdown file. Off for repos with legacy docs.
        type: boolean
        default: true
      lychee-args:
        description: Extra lychee arguments, such as --exclude-path entries.
        type: string
        default: ""
      allow-data:
        description: Skip the data-file check. Only for repos with a pending data migration.
        type: boolean
        default: false
      runner:
        description: The runs-on value as JSON. Default is the PC's runners; public repos pass '"ubuntu-latest"'.
        type: string
        default: '["self-hosted", "windows", "neoluna-local"]'

permissions:
  contents: read

env:
  # Check out exactly the bytes in git on every OS, without touching the runner user's git config.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: secrets
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary, pinned by version and SHA-256, cached in the runner's tool folder.
      - name: gitleaks
        env:
          V: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Windows) f="gitleaks_${V}_windows_x64.zip"; sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
            Linux) f="gitleaks_${V}_linux_x64.tar.gz"; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            *) echo "::error::No gitleaks build pinned for $RUNNER_OS"; exit 1 ;;
          esac
          d="$(cygpath -u "$RUNNER_TOOL_CACHE" 2>/dev/null || echo "$RUNNER_TOOL_CACHE")/gitleaks/$V"
          if [ ! -e "$d/gitleaks" ] && [ ! -e "$d/gitleaks.exe" ]; then
            mkdir -p "$d"
            curl -sSfL -o "$d/$f" "https://github.com/gitleaks/gitleaks/releases/download/v$V/$f"
            echo "$sum  $d/$f" | sha256sum -c -
            case "$f" in *.zip) unzip -oq "$d/$f" -d "$d" ;; *) tar -xzf "$d/$f" -C "$d" ;; esac
            rm -f "$d/$f"
          fi
          "$d/gitleaks" git . --redact --no-banner

  docs:
    name: docs
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: inputs.markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      # lychee-action downloads only the Linux build, so lychee is fetched here for either OS.
      - name: lychee (offline link check)
        env:
          V: v0.24.2
          ARGS: ${{ inputs.lychee-args }}
        run: |
          case "$RUNNER_OS" in
            Windows) f=lychee-x86_64-pc-windows-msvc.zip; sum=32975d1493ee1a975d6bb41e4fb56fe419cb442ded628bb772ba2e614acfacad ;;
            Linux) f=lychee-x86_64-unknown-linux-gnu.tar.gz; sum=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a ;;
            *) echo "::error::No lychee build pinned for $RUNNER_OS"; exit 1 ;;
          esac
          d="$(cygpath -u "$RUNNER_TOOL_CACHE" 2>/dev/null || echo "$RUNNER_TOOL_CACHE")/lychee/$V"
          if ! ls "$d"/lychee "$d"/lychee.exe >/dev/null 2>&1; then
            mkdir -p "$d"
            curl -sSfL -o "$d/$f" "https://github.com/lycheeverse/lychee/releases/download/lychee-$V/$f"
            echo "$sum  $d/$f" | sha256sum -c -
            case "$f" in *.zip) unzip -oqj "$d/$f" -d "$d" ;; *) tar -xzf "$d/$f" -C "$d" ;; esac
            [ -e "$d/lychee" ] || [ -e "$d/lychee.exe" ] || mv "$(find "$d" -name lychee -type f | head -n 1)" "$d/lychee"
            rm -f "$d/$f"
          fi
          # shellcheck disable=SC2086 # ARGS holds several arguments on purpose
          "$d/lychee" --offline --no-progress $ARGS '**/*.md'
      # House style: no em dashes in new writing. Checks only lines this PR adds.
      - name: No em dashes in added lines
        if: github.event_name == 'pull_request'
        run: |
          if git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- '*.md' | grep '^+[^+]' | grep -n $'—'; then
            echo "::error::Em dash in added Markdown. Recast with a comma, colon or full stop."
            exit 1
          fi

  # Data lives in Supabase or Google Drive, never in git. Checks only files this PR adds.
  data:
    name: data
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No data files added
        if: github.event_name == 'pull_request' && !inputs.allow-data
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in */fixtures/*|fixtures/*) continue ;; esac
            case "${f,,}" in
              *.zip|*.rar|*.7z|*.xlsx|*.xls) echo "::error file=$f::Archive or spreadsheet. Large files go in Google Drive, tabular data in Supabase."; bad=1 ;;
              *.csv|*.json|*.parquet)
                if [ "$(wc -c < "$f")" -gt 1048576 ]; then echo "::error file=$f::Data file over 1 MB. Tabular data goes in Supabase; small test data goes in a fixtures folder."; bad=1; fi ;;
            esac
          done < <(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")
          exit $bad

  # Conventional Commits in the PR title, which becomes the squash commit.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
